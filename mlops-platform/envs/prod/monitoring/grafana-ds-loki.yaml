# envs/prod/monitoring/grafana-ds-loki.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-ds-loki
  namespace: monitoring-prod
  labels:
    grafana_datasource: "1"
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-prod.observability-prod.svc.cluster.local:3100
        isDefault: false
        jsonData:
          derivedFields:
            # Example: use the traceID field when integrating with Tempo
            - matcherRegex: "trace_id=(\\w+)"
              name: "traceID"
              url: "$${__value.raw}"
