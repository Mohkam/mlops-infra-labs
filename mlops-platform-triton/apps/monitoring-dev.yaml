apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,PruneLast=true,ServerSideApply=true
spec:
  project: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring-dev
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.5.0
    helm:
      skipCrds: true
      values: |
        global:
          imageRegistry: ""

        grafana:
          image:
            repository: grafana/grafana
            tag: "11.2.2-security-01"
          sidecar:
            image:
              repository: kiwigrid/k8s-sidecar
              tag: "1.28.0"
          admin:
            existingSecret: grafana-admin-secret-dev
            userKey: admin-user
            passwordKey: admin-password
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts: [grafana-dev.local]
            path: /
            pathType: Prefix
            tls:
              - hosts: [grafana-dev.local]
                secretName: grafana-tls
          persistence:
            enabled: true
            type: pvc
            storageClassName: nfs-monitoring
            size: 10Gi

        alertmanager:
          alertmanagerSpec:
            configSecret: alertmanager-config-dev
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: nfs-monitoring
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 50Gi
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts: [alert-dev.local]
            path: /
            pathType: Prefix
            tls:
              - hosts: [alert-dev.local]
                secretName: alertmanager-tls


        # Prevent duplicate targets: Add a stack label to the kubelet Service so the ServiceMonitor matches only that label
        kubelet:
          service:
            labels:
              stack: dev
          serviceMonitor:
            namespaceSelector:
              matchNames: [kube-system]
            selector:
              matchLabels:
                stack: dev
            metricRelabelings:
              - action: keep
                sourceLabels: [namespace]
                regex: '.*-dev|monitoring-dev|kube-system'
            cAdvisorMetricRelabelings:
              - action: keep
                sourceLabels: [namespace]
                regex: '.*-dev|monitoring-dev|kube-system'

        kube-state-metrics:
          prometheus:
            monitor:
              enabled: true
              additionalLabels:
                release: monitoring-dev
              metricRelabelings:
                - action: keep
                  sourceLabels: [namespace]
                  regex: '.*-dev|monitoring-dev|kube-system'

        prometheus:
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts: [prometheus-dev.local]
            path: /
            pathType: Prefix
            tls:
              - hosts: [prometheus-dev.local]
                secretName: prometheus-tls
          prometheusSpec:
            externalUrl: "https://prometheus-dev.local"

            # Avoid conflicts with operator defaults
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false

            # Label based selection
            serviceMonitorSelector:
              matchLabels:
                release: monitoring-dev

            podMonitorSelector:
              matchLabels:
                release: monitoring-dev

            ruleSelector:
              matchLabels:
                release: monitoring-dev

            # Namespace restriction is empty object (same as operator)
            serviceMonitorNamespaceSelector: {}
            podMonitorNamespaceSelector: {}
            ruleNamespaceSelector: {}
        
            # Operator defaults to "/" prefix
            routePrefix: "/"

            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 50Gi
            retention: 15d
            retentionSize: 30GiB

        # Disable selected kube-system components
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        coreDns:
          enabled: false

        prometheus-node-exporter:
          enabled: true
          hostNetwork: false
          hostPID: false
          service:
            hostPort: false
            type: ClusterIP
            port: 9100
            targetPort: 9100
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
